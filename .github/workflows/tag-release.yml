name: Tag Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to create (e.g. v0.1.2)"
        required: true
      sha:
        description: "Commit SHA to tag"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.tag }}" "${{ inputs.sha }}" -m "${{ inputs.tag }}"
          git push origin "refs/tags/${{ inputs.tag }}"

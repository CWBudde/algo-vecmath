name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, so it covers the arm64 NEON backend
        # natively.  That matters: the NEON assembly shipped broken through
        # v0.1.1 (ARM32 mnemonics, never assembled) and then with an
        # uninitialised scalar-tail counter, neither of which any amd64 job
        # can see.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -count=1 -race ./...

  purego:
    name: Test (purego fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The generic implementations are the reference the SIMD backends are
      # checked against, so they need to stay green on their own.
      - name: Test
        run: go test -count=1 -tags purego ./...

  vet:
    name: Vet and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...
